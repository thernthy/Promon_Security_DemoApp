name: bank_demo_app
description: A demo banking app built with Flutter using static demo data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/frank bank.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/frank bank.png"

flutter:
  uses-material-design: true